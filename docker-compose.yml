services:
  screenshot-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: screenshot-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=screenshot_service=info,tower_http=info
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - seccomp:unconfined
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
